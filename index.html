<!doctype html>
<!-- 版本：PWA外殼_20261120_1147（1147：手機已安裝 App 時，掃 QR 會直接喚起已開著的 App 而不換頁（停在登記頁）→ 接 launchQueue 收到 QR 網址就改開查詢頁；manifest 加 launch_handler；1128：網址帶派任單當日代碼 ?d=&k= 時改開「目前待命」查詢頁（顯示姓名電話），派任單 QR 改連 App；2328：App 圖示換成環狀箭頭＋十字＋心電圖（圖示原檔.jpg）；1130：接手報表下載——登記頁傳來 PDF／Excel，顯示「開啟檔案」按鈕；1118：啟動畫面與登入頁一致——院徽 logo＋橘色「轉診待命系統」；logo 改透明底；0921：替登記頁保存「記住我」憑證） -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轉診待命系統</title>
<meta name="theme-color" content="#d98c3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<!-- iPhone：加入主畫面後全螢幕開啟、用這個圖示與名稱 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="轉診待命">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --orange:#d98c3b; --ink:#1d2733; --muted:#5d6b7a; --bg:#f6f4f1; }
  html, body { margin:0; height:100%; background:var(--bg); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; color:var(--ink); }
  /* 狀態列下方留安全區，iframe 佔滿其餘空間 */
  body { padding-top:env(safe-area-inset-top,0px); box-sizing:border-box; }
  #app { display:block; width:100%; height:100%; border:0; }
  #splash { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; transition:opacity .3s; }
  #splash.hide { opacity:0; pointer-events:none; }
  /* 與 GAS 登入頁相同：logo 在上、橘色系統名稱在下 */
  #splash img.logo { width:min(360px,85vw); height:auto; }
  #splash h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:.15em; color:#c4741f; }
  #msg { color:var(--muted); font-size:14px; min-height:1.4em; }
  /* 報表下載：要使用者點一下才開啟，手機瀏覽器不允許非點擊觸發的下載 */
  #fileBox { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); background:#fff; border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.25); padding:14px; display:none; flex-direction:column; gap:10px; z-index:10; }
  #fileBox.show { display:flex; }
  #fileName { font-size:14px; color:var(--ink); word-break:break-all; }
  #fileBox .row { display:flex; gap:10px; }
  #fileBox button { flex:1; border:0; border-radius:10px; padding:12px; font-size:16px; font-weight:600; }
  #fileOpen { background:#b8661a; color:#fff; }
  #fileClose { background:#fbf1e6; color:#8a4b0f; }
  #retry { display:none; border:0; background:var(--orange); color:#fff; font-size:16px; padding:10px 22px; border-radius:10px; }
</style>
</head>
<body>
<iframe id="app" title="轉診待命系統" referrerpolicy="no-referrer"></iframe>
<div id="fileBox" role="dialog" aria-label="報表檔案">
  <div id="fileName"></div>
  <div class="row"><button id="fileOpen" type="button">開啟檔案</button><button id="fileClose" type="button">關閉</button></div>
</div>
<div id="splash" role="status">
  <img class="logo" src="logo.png" alt="雲林長庚紀念醫院">
  <h1>轉診待命系統</h1>
  <div id="msg">載入中…</div>
  <button id="retry" type="button">重新載入</button>
</div>
<script>
  // GAS 部署網址（與派任單 表單JS 的 GAS_URL 相同）；重新部署成新網址時只要改這一行
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzF51OdZM44naHSe0DwNJtS2XdMQAvT7PbL_BG0ezh5F0vaNVyAVAB9vjFGq1858NI/exec';
  // 外殼只開「我的待命」登記頁；查詢頁要靠派任單上的當日 QR 才看得到姓名，不放進 App
  var START = GAS_URL + '?page=me';
  // 派任單上的當日 QR 連到 App 並帶 ?d=日期&k=代碼 → 改開查詢頁；代碼由 GAS 驗證，隔天失效
  function boardFrom(search) {
    var q = {}, s = String(search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < s.length; i++) { var kv = s[i].split('='); q[kv[0]] = decodeURIComponent(kv[1] || ''); }
    return (/^\d{8}$/.test(q.d || '') && /^[0-9a-f]{8}$/.test(q.k || '')) ? GAS_URL + '?d=' + q.d + '&k=' + q.k : '';
  }
  START = boardFrom(location.search) || START;

  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  var msg = document.getElementById('msg');
  var retry = document.getElementById('retry');
  var timer;

  function load() {
    retry.style.display = 'none';
    splash.classList.remove('hide');
    if (!navigator.onLine) { fail('目前沒有網路，請連上網路後再試。'); return; }
    msg.textContent = '載入中…';
    // Google Apps Script 第一次開啟常要 3–8 秒，超過 20 秒才當成失敗
    clearTimeout(timer);
    timer = setTimeout(function () { fail('連線較慢或無法連到 Google，請稍後再試。'); }, 20000);
    frame.src = START + (START.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
  }
  function fail(t) { clearTimeout(timer); msg.textContent = t; retry.style.display = 'inline-block'; }

  frame.addEventListener('load', function () {
    if (!frame.src) return;
    clearTimeout(timer);
    splash.classList.add('hide');
  });
  retry.addEventListener('click', load);
  window.addEventListener('online', function () { if (!splash.classList.contains('hide')) load(); });

  // ---------- 記住我 ----------
  // 登記頁在 Google 的網域裡，iPhone 對嵌入頁面的儲存常會清掉；改由外殼（主畫面 App 本身的網站）代存。
  // 只回應來自 Google Apps Script 頁面（googleusercontent.com）的要求
  var KEY = 'standby_remember';
  function fromGas(o) { return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); }
  window.addEventListener('message', function (e) {
    if (!fromGas(e.origin) || !e.data || !e.data.standby) return;
    var d = e.data;
    try {
      if (d.standby === 'get') {
        var c = null;
        try { c = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (x) {}
        e.source.postMessage({ standby: 'cred', cred: c }, e.origin);
      } else if (d.standby === 'save' && d.cred && /^tok:/.test(d.cred.tok || '')) {
        localStorage.setItem(KEY, JSON.stringify({ phone: String(d.cred.phone), tok: d.cred.tok }));
      } else if (d.standby === 'clear') {
        localStorage.removeItem(KEY);
      } else if (d.standby === 'file' && d.b64 && d.name) {
        showFile(d);
      }
    } catch (x) {}
  });

  // ---------- 報表下載 ----------
  var FILE = null;
  var box = document.getElementById('fileBox');
  function showFile(d) {
    FILE = { name: String(d.name).replace(/[\\/:*?"<>|]/g, '_'), mime: String(d.mime || 'application/octet-stream'), b64: String(d.b64) };
    document.getElementById('fileName').textContent = '報表已產生：' + FILE.name;
    box.classList.add('show');
  }
  document.getElementById('fileOpen').addEventListener('click', function () {
    if (!FILE) return;
    var bin = atob(FILE.b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u], { type: FILE.mime }));
    var a = document.createElement('a');
    a.href = url; a.download = FILE.name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    box.classList.remove('show'); FILE = null;
  });
  document.getElementById('fileClose').addEventListener('click', function () { box.classList.remove('show'); FILE = null; });

  // 手機已安裝 App（Android Chrome 等）時，掃 QR 會喚起已開著的 App；這裡接住 QR 網址，改開查詢頁
  if ('launchQueue' in window && window.launchQueue.setConsumer) {
    window.launchQueue.setConsumer(function (p) {
      if (!p || !p.targetURL) return;
      var b = boardFrom(new URL(p.targetURL).search);
      if (b && b !== START) { START = b; load(); }
    });
  }

  // 離線時也能開出外殼與提示，不是一片空白
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  load();
</script>
</body>
</html>
